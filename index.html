<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dose Certa | Protótipo</title>
<style>
  :root { --red:#941d3e; --red-dark:#73132f; --ink:#252c36; --muted:#6c747e; --line:#eee4e8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif; color:var(--ink);
    background:radial-gradient(ellipse at 30% 75%,#f0dce5 0,transparent 60%),#fcf7f9; }
  main { width:min(640px,100%); text-align:center; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:2px; color:#97677a; }
  h1 { font-size:clamp(34px,7vw,52px); letter-spacing:-1.8px; margin:16px 0 12px; }
  h1 span { color:var(--red); }
  p { color:var(--muted); line-height:1.6; margin:0 0 32px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  a.card { display:block; text-align:left; text-decoration:none; color:inherit; background:#fff;
    border:1px solid var(--line); border-radius:18px; padding:24px; transition:border-color .2s; }
  a.card:hover { border-color:var(--red); }
  a.card:focus-visible { outline:3px solid #579bf0; outline-offset:3px; }
  a.card strong { display:flex; justify-content:space-between; font-size:19px; margin-bottom:8px; }
  a.card strong span { color:var(--red); }
  a.card small { color:var(--muted); line-height:1.5; }
  footer { margin-top:32px; font-size:11px; color:#a18b95; }
  @media (prefers-reduced-motion:reduce) { a.card { transition:none; } }
</style>
</head>
<body>
<main>
  <span class="eyebrow">PROTÓTIPO ACADÊMICO</span>
  <h1>Dose<span>Certa</span></h1>
  <p>Escolha qual área do protótipo você quer abrir.</p>
  <div class="cards">
    <a class="card" href="cliente/dose.html"><strong>Área do cliente <span aria-hidden="true">→</span></strong><small>Busque medicamentos, escolha a farmácia e acompanhe o pedido.</small></a>
    <a class="card" href="farmacia/farmacia.html"><strong>Portal da farmácia <span aria-hidden="true">→</span></strong><small>Gerencie estoque, pedidos, entregas e relatórios.</small></a>
  </div>
  <footer>Dados fictícios · sem conexão com farmácias reais</footer>
</main>
</body>
</html>
